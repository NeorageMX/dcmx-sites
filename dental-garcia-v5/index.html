<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dental García | Tu sonrisa, nuestra especialidad | Toluca</title>
<style>
  :root {
    --primary: #0ea5e9;
    --primary-dark: #0284c7;
    --primary-darker: #0369a1;
    --primary-light: #e0f2fe;
    --accent: #f0f9ff;
    --text: #1e293b;
    --text-light: #64748b;
    --white: #ffffff;
    --dark: #0f172a;
    --darker: #080e1a;
    --gray: #f8fafc;
    --border: #e2e8f0;
    --success: #25D366;
    --shadow-sm: 0 2px 8px rgba(14,165,233,0.08);
    --shadow-md: 0 8px 30px rgba(14,165,233,0.12);
    --shadow-lg: 0 20px 60px rgba(14,165,233,0.18);
    --radius: 16px;
    --radius-sm: 10px;
  }

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
    background: var(--white);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ===== NAV ===== */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    text-decoration: none;
  }

  .nav-logo-icon {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
  }

  .nav-logo-text {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--text);
    line-height: 1.1;
  }

  .nav-logo-text span {
    color: var(--primary);
  }

  .nav-links {
    display: flex;
    list-style: none;
    gap: 2rem;
    align-items: center;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--text);
    font-weight: 500;
    font-size: 0.95rem;
    transition: color 0.3s ease;
  }

  .nav-links a:hover {
    color: var(--primary);
  }

  .nav-cta {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: var(--white) !important;
    padding: 0.5rem 1.25rem;
    border-radius: 50px;
    font-weight: 600 !important;
    transition: transform 0.3s ease, box-shadow 0.3s ease !important;
  }

  .nav-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(14,165,233,0.4) !important;
  }

  .nav-hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
  }

  .nav-hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--text);
    border-radius: 2px;
    transition: 0.3s ease;
  }

  /* ===== HERO ===== */
  #inicio {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--primary-darker) 0%, var(--primary) 50%, #38bdf8 100%);
    display: flex;
    align-items: center;
    padding: 8rem 2rem 6rem;
    position: relative;
    overflow: hidden;
  }

  #inicio::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 70%;
    height: 170%;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
    pointer-events: none;
  }

  #inicio::after {
    content: '';
    position: absolute;
    bottom: -30%;
    left: -10%;
    width: 50%;
    height: 80%;
    background: rgba(255,255,255,0.03);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero-inner {
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
    position: relative;
    z-index: 2;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    color: var(--white);
    padding: 0.4rem 1rem;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 1.5rem;
    backdrop-filter: blur(8px);
  }

  .hero-title {
    font-size: clamp(2.4rem, 5vw, 3.8rem);
    font-weight: 900;
    color: var(--white);
    line-height: 1.1;
    margin-bottom: 1.25rem;
    letter-spacing: -0.02em;
  }

  .hero-title span {
    color: #bae6fd;
  }

  .hero-subtitle {
    font-size: 1.15rem;
    color: rgba(255,255,255,0.85);
    margin-bottom: 2.5rem;
    line-height: 1.7;
  }

  .hero-btns {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--white);
    color: var(--primary-dark);
    padding: 0.9rem 2rem;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 40px rgba(0,0,0,0.3);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.4);
    color: var(--white);
    padding: 0.9rem 2rem;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    backdrop-filter: blur(8px);
    transition: background 0.3s ease, transform 0.3s ease;
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.2);
    transform: translateY(-3px);
  }

  .hero-stats {
    display: flex;
    gap: 2rem;
    margin-top: 3rem;
    flex-wrap: wrap;
  }

  .hero-stat {
    text-align: center;
  }

  .hero-stat-num {
    font-size: 2rem;
    font-weight: 900;
    color: var(--white);
    line-height: 1;
  }

  .hero-stat-label {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.7);
    margin-top: 0.2rem;
  }

  .hero-visual {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .hero-card-main {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 24px;
    padding: 2.5rem;
    width: 100%;
    max-width: 360px;
    color: var(--white);
    position: relative;
    z-index: 2;
  }

  .hero-card-icon {
    font-size: 3.5rem;
    margin-bottom: 1rem;
    display: block;
  }

  .hero-card-title {
    font-size: 1.3rem;
    font-weight: 800;
    margin-bottom: 0.5rem;
  }

  .hero-card-sub {
    font-size: 0.9rem;
    opacity: 0.8;
    margin-bottom: 1.5rem;
  }

  .hero-card-services {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .hero-card-service-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.9rem;
  }

  .hero-check {
    width: 20px;
    height: 20px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    flex-shrink: 0;
  }

  .hero-float-card {
    position: absolute;
    background: white;
    border-radius: var(--radius-sm);
    padding: 0.75rem 1rem;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
  }

  .hero-float-1 {
    top: -20px;
    right: -20px;
  }

  .hero-float-2 {
    bottom: -20px;
    left: -20px;
  }

  /* ===== SECTION BASE ===== */
  section {
    padding: 5.5rem 2rem;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }

  .section-tag {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.35rem 1rem;
    border-radius: 50px;
    margin-bottom: 1rem;
  }

  .section-title {
    font-size: clamp(1.8rem, 3.5vw, 2.6rem);
    font-weight: 900;
    color: var(--text);
    line-height: 1.15;
    margin-bottom: 1rem;
    letter-spacing: -0.02em;
  }

  .section-title span {
    color: var(--primary);
  }

  .section-subtitle {
    font-size: 1.05rem;
    color: var(--text-light);
    max-width: 580px;
    line-height: 1.7;
  }

  .section-header {
    text-align: center;
    margin-bottom: 3.5rem;
  }

  .section-header .section-subtitle {
    margin: 0 auto;
  }

  /* ===== SERVICES ===== */
  #servicios {
    background: var(--gray);
  }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
  }

  .service-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 2.2rem;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    cursor: default;
    position: relative;
    overflow: hidden;
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary), #38bdf8);
    transform: scaleX(0);
    transition: transform 0.3s ease;
    transform-origin: left;
  }

  .service-card:hover {
    transform: translateY(-8px);
    box-shadow: var(--shadow-lg);
    border-color: var(--primary-light);
  }

  .service-card:hover::before {
    transform: scaleX(1);
  }

  .service-emoji {
    font-size: 2.8rem;
    margin-bottom: 1rem;
    display: block;
  }

  .service-name {
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 0.6rem;
  }

  .service-desc {
    font-size: 0.93rem;
    color: var(--text-light);
    line-height: 1.65;
    margin-bottom: 1.2rem;
  }

  .service-link {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    color: var(--primary);
    font-weight: 600;
    font-size: 0.88rem;
    text-decoration: none;
    transition: gap 0.3s ease;
  }

  .service-link:hover {
    gap: 0.6rem;
  }

  /* ===== NOSOTROS ===== */
  #nosotros {
    background: var(--white);
  }

  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
  }

  .about-tag {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.35rem 1rem;
    border-radius: 50px;
    margin-bottom: 1rem;
  }

  .about-title {
    font-size: clamp(1.8rem, 3vw, 2.4rem);
    font-weight: 900;
    color: var(--text);
    margin-bottom: 1rem;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }

  .about-text {
    color: var(--text-light);
    font-size: 1rem;
    line-height: 1.75;
    margin-bottom: 2rem;
  }

  .about-benefits {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    margin-bottom: 2rem;
  }

  .about-benefit {
    display: flex;
    align-items: flex-start;
    gap: 0.8rem;
    font-size: 0.95rem;
    color: var(--text);
  }

  .about-benefit-icon {
    width: 24px;
    height: 24px;
    background: linear-gradient(135deg, var(--primary), #38bdf8);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    flex-shrink: 0;
    margin-top: 1px;
    color: white;
  }

  .about-benefit strong {
    font-weight: 700;
    color: var(--text);
  }

  .about-cta {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: var(--white);
    padding: 0.9rem 2rem;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 6px 25px rgba(14,165,233,0.35);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .about-cta:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(14,165,233,0.45);
  }

  .about-accent-box {
    background: linear-gradient(135deg, var(--primary-darker) 0%, var(--primary) 60%, #38bdf8 100%);
    border-radius: 24px;
    padding: 3rem 2.5rem;
    color: white;
    position: relative;
    overflow: hidden;
  }

  .about-accent-box::before {
    content: '';
    position: absolute;
    top: -40%;
    right: -30%;
    width: 80%;
    height: 80%;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }

  .about-accent-icon {
    font-size: 3rem;
    margin-bottom: 1.5rem;
    display: block;
  }

  .about-accent-title {
    font-size: 1.5rem;
    font-weight: 900;
    margin-bottom: 0.75rem;
  }

  .about-accent-text {
    font-size: 0.95rem;
    opacity: 0.85;
    line-height: 1.7;
    margin-bottom: 2rem;
  }

  .about-accent-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.2rem;
  }

  .about-stat-box {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: var(--radius-sm);
    padding: 1rem;
    text-align: center;
    backdrop-filter: blur(8px);
  }

  .about-stat-num {
    font-size: 1.8rem;
    font-weight: 900;
    line-height: 1;
    margin-bottom: 0.25rem;
  }

  .about-stat-label {
    font-size: 0.78rem;
    opacity: 0.75;
  }

  /* ===== PROCESO ===== */
  #proceso {
    background: var(--gray);
  }

  .steps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1.5rem;
    margin-top: 1rem;
  }

  .step-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 2rem 1.75rem;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    position: relative;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .step-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-md);
  }

  .step-number {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, var(--primary), #38bdf8);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    font-weight: 900;
    color: white;
    margin: 0 auto 1.2rem;
    box-shadow: 0 6px 20px rgba(14,165,233,0.3);
  }

  .step-icon {
    font-size: 2rem;
    margin-bottom: 0.75rem;
    display: block;
  }

  .step-title {
    font-size: 1rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .step-desc {
    font-size: 0.88rem;
    color: var(--text-light);
    line-height: 1.6;
  }

  /* ===== TESTIMONIALS ===== */
  #testimonios {
    background: var(--white);
  }

  .testimonials-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.5rem;
  }

  .testimonial-card {
    background: var(--gray);
    border-radius: var(--radius);
    padding: 2rem;
    border: 1px solid var(--border);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .testimonial-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-md);
  }

  .testimonial-stars {
    color: #f59e0b;
    font-size: 1rem;
    margin-bottom: 1rem;
    letter-spacing: 2px;
  }

  .testimonial-text {
    font-size: 0.95rem;
    color: var(--text);
    line-height: 1.7;
    font-style: italic;
    margin-bottom: 1.5rem;
  }

  .testimonial-text::before {
    content: '"';
    color: var(--primary);
    font-size: 2rem;
    font-style: normal;
    line-height: 0;
    vertical-align: -0.5rem;
    margin-right: 0.2rem;
  }

  .testimonial-author {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .testimonial-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }

  .avatar-1 { background: linear-gradient(135deg, var(--primary), #38bdf8); }
  .avatar-2 { background: linear-gradient(135deg, #a855f7, #ec4899); }
  .avatar-3 { background: linear-gradient(135deg, #f59e0b, #ef4444); }

  .testimonial-name {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text);
  }

  .testimonial-service {
    font-size: 0.8rem;
    color: var(--text-light);
    margin-top: 0.1rem;
  }

  /* ===== CONTACT ===== */
  #contacto {
    background: linear-gradient(135deg, var(--dark) 0%, var(--darker) 100%);
    text-align: center;
    padding: 6rem 2rem;
    position: relative;
    overflow: hidden;
  }

  #contacto::before {
    content: '';
    position: absolute;
    top: -40%;
    left: -10%;
    width: 50%;
    height: 100%;
    background: rgba(14,165,233,0.06);
    border-radius: 50%;
    pointer-events: none;
  }

  #contacto::after {
    content: '';
    position: absolute;
    bottom: -40%;
    right: -10%;
    width: 50%;
    height: 100%;
    background: rgba(14,165,233,0.04);
    border-radius: 50%;
    pointer-events: none;
  }

  .contact-inner {
    max-width: 680px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }

  .contact-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(14,165,233,0.15);
    border: 1px solid rgba(14,165,233,0.3);
    color: #7dd3fc;
    padding: 0.4rem 1rem;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 1.5rem;
  }

  .contact-title {
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 900;
    color: var(--white);
    margin-bottom: 1rem;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .contact-title span {
    color: var(--primary);
  }

  .contact-subtitle {
    font-size: 1.05rem;
    color: rgba(255,255,255,0.6);
    margin-bottom: 2.5rem;
    line-height: 1.7;
  }

  .contact-info-cards {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 2.5rem;
  }

  .contact-info-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius-sm);
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    color: rgba(255,255,255,0.8);
    font-size: 0.9rem;
  }

  .contact-info-icon {
    font-size: 1.2rem;
  }

  .btn-whatsapp {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--success);
    color: var(--white);
    padding: 1.1rem 2.5rem;
    border-radius: 50px;
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 8px 35px rgba(37,211,102,0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    margin-bottom: 1rem;
  }

  .btn-whatsapp:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 50px rgba(37,211,102,0.5);
  }

  .btn-whatsapp-icon {
